[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "stemlift"
version = "0.1.0"
description = "Extract audio stems and custom backing tracks with Demucs"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "demucs==4.1.0",
    "numpy==2.5.4",
    "torch==2.14.1",
]

[project.scripts]
stemlift = "stemlift.cli:main"
stemlift-worker = "stemlift.desktop_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stemlift"]

[tool.uv]
exclude-newer = "2026-10-11T23:08:50Z"
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32'",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
desktop = [
    "pyinstaller==6.22.3",
]
dev = [
    "ruff==0.17.0",
]
