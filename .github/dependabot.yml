version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    open-pull-requests-limit: 10
    groups:
      python-deps:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    open-pull-requests-limit: 10
    groups:
      npm-deps:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    open-pull-requests-limit: 10
    groups:
      rust-deps:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    # Python upgrades must be coordinated across .python-version,
    # requires-python, uv.lock, Docker, CI, and platform compatibility. Docker
    # tags also expose prereleases such as 3.15.0-rc3 as apparent upgrades.
    ignore:
      - dependency-name: python
    open-pull-requests-limit: 5
    groups:
      container-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
