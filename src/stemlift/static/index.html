<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StemLift</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, sans-serif;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #151515;
      color: #f4f4f4;
    }

    main {
      width: min(28rem, calc(100% - 3rem));
    }

    h1 {
      margin-bottom: 0.4rem;
      font-size: 2rem;
    }

    p {
      color: #aaa;
    }

    form {
      display: grid;
      gap: 1rem;
      margin-top: 2rem;
    }

    input[type="file"],
    select,
    button {
      box-sizing: border-box;
      width: 100%;
      padding: 0.8rem;
      border: 1px solid #444;
      border-radius: 0.4rem;
      background: #222;
      color: inherit;
      font: inherit;
    }

    button {
      border-color: #f4f4f4;
      background: #f4f4f4;
      color: #151515;
      cursor: pointer;
      font-weight: 650;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.5;
    }

    fieldset {
      display: grid;
      gap: 0.7rem;
      margin: 0;
      padding: 1rem;
      border: 1px solid #444;
      border-radius: 0.4rem;
    }

    legend {
      padding: 0 0.35rem;
      font-weight: 650;
    }

    fieldset p {
      margin: 0 0 0.2rem;
      font-size: 0.9rem;
    }

    label {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    label input {
      width: auto;
    }

    #status {
      min-height: 1.5rem;
      margin-top: 1rem;
    }

    #download {
      color: inherit;
    }

    progress {
      width: 100%;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>StemLift</h1>
    <p>Extract individual stems or remove stems to create a backing track.</p>

    <form id="upload-form">
      <input id="audio" name="audio" type="file" accept="audio/*" required>
      <select id="format" name="format" aria-label="Output format">
        <option value="mp3">MP3</option>
        <option value="wav">WAV</option>
      </select>
      <fieldset>
        <legend>Extract stems</legend>
        <p>Each selected stem will be included as a separate file.</p>
        <label><input name="stems-stem" type="checkbox" value="vocals">Vocals</label>
        <label><input name="stems-stem" type="checkbox" value="drums">Drums</label>
        <label><input name="stems-stem" type="checkbox" value="bass" checked>Bass</label>
        <label><input name="stems-stem" type="checkbox" value="other">Other (guitars, keys, and more)</label>
        <button type="submit" data-mode="stems">Extract selected stems</button>
      </fieldset>
      <fieldset>
        <legend>Create a backing track</legend>
        <p>Selected stems will be removed from the backing track.</p>
        <label><input name="backing-stem" type="checkbox" value="vocals">Vocals</label>
        <label><input name="backing-stem" type="checkbox" value="drums">Drums</label>
        <label><input name="backing-stem" type="checkbox" value="bass">Bass</label>
        <label><input name="backing-stem" type="checkbox" value="other">Other (guitars, keys, and more)</label>
        <button type="submit" data-mode="backing">Create backing track</button>
      </fieldset>
    </form>

    <progress id="progress" max="100" hidden></progress>
    <p id="status" role="status" aria-live="polite"></p>
    <a id="download" hidden>Download result</a>
  </main>

  <script>
    const form = document.querySelector("#upload-form");
    const fileInput = document.querySelector("#audio");
    const formatInput = document.querySelector("#format");
    const buttons = [...form.querySelectorAll("button")];
    const progress = document.querySelector("#progress");
    const status = document.querySelector("#status");
    const download = document.querySelector("#download");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = fileInput.files[0];
      if (!file) return;

      const mode = event.submitter?.dataset.mode || "stems";
      const selectedStems = [
        ...form.querySelectorAll(`input[name="${mode}-stem"]:checked`),
      ];
      if (!selectedStems.length) {
        status.textContent = "Select at least one stem.";
        return;
      }
      if (mode === "backing" && selectedStems.length === 4) {
        status.textContent = "A backing track must leave at least one stem.";
        return;
      }

      buttons.forEach((button) => { button.disabled = true; });
      download.hidden = true;
      download.removeAttribute("href");
      progress.hidden = false;
      progress.removeAttribute("value");
      status.textContent = "Separating… this can take a while.";

      const progressTimer = setInterval(async () => {
        try {
          const response = await fetch("/progress", { cache: "no-store" });
          if (!response.ok) return;
          const state = await response.json();
          if (state.running) {
            progress.value = state.progress;
            const eta = state.eta ? ` · ETA ${state.eta}` : "";
            status.textContent = `Separating… ${state.progress}%${eta}`;
          }
        } catch (_) {
          // The upload request reports connection failures.
        }
      }, 500);

      try {
        const format = formatInput.value;
        const parameters = new URLSearchParams({ format, mode });
        selectedStems.forEach((checkbox) => {
          parameters.append("stem", checkbox.value);
        });
        parameters.append("filename", file.name);
        const response = await fetch(`/extract?${parameters}`, {
          method: "PUT",
          headers: {
            "Content-Type": file.type || "application/octet-stream",
          },
          body: file,
        });

        if (!response.ok) {
          throw new Error((await response.text()) || `Request failed (${response.status})`);
        }

        const result = await response.json();
        download.href = result.url;
        download.download = result.filename;
        download.hidden = false;
        download.click();
        progress.value = 100;
        status.textContent = result.cached
          ? "Done. The cached ZIP download has started."
          : "Done. Your ZIP download has started.";
      } catch (error) {
        status.textContent = `Error: ${error.message}`;
      } finally {
        clearInterval(progressTimer);
        buttons.forEach((button) => { button.disabled = false; });
      }
    });
  </script>
</body>
</html>
