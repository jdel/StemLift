[package]
name = "stemlift-desktop"
version = "0.1.0"
description = "Desktop stem separation with Demucs"
authors = ["jdel"]
edition = "2024"

[lib]
name = "stemlift_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-shell = "=2.5.0"
